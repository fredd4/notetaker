<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notetaker</title>
<style>
  :root {
    --bg: #1c1c1e;
    --panel: #2c2c2e;
    --text: #f2f2f7;
    --muted: #8e8e93;
    --accent: #ff453a;
    --accent-dim: #5c2320;
    --ok: #30d158;
    --border: #3a3a3c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 24px;
    gap: 22px;
    overflow-y: auto;
  }
  h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
    color: var(--muted);
    text-transform: uppercase;
  }
  .timer {
    font-size: 52px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .record-btn {
    width: 92px; height: 92px;
    min-width: 92px; min-height: 92px;
    aspect-ratio: 1 / 1;
    flex-shrink: 0;
    border-radius: 50%;
    border: 3px solid var(--border);
    background: var(--accent);
    cursor: pointer;
    transition: all .18s ease;
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .record-btn:hover { transform: scale(1.04); }
  .record-btn:disabled { opacity: .4; cursor: default; transform: none; }
  .record-btn .inner {
    width: 34px; height: 34px;
    background: #fff;
    border-radius: 50%;
    transition: all .18s ease;
  }
  /* stan nagrywania: kwadrat = stop */
  body.recording .record-btn .inner { border-radius: 6px; width: 30px; height: 30px; }
  body.recording .record-btn { animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 0 var(--accent-dim); }
    50%     { box-shadow: 0 0 0 12px transparent; }
  }
  .stats {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; justify-content: space-between; font-size: 13px; }
  .row .label { color: var(--muted); }
  .row .val { font-variant-numeric: tabular-nums; }
  .status {
    font-size: 13px;
    color: var(--muted);
    min-height: 18px;
    text-align: center;
  }
  .status.error { color: var(--accent); }
  .status.ok { color: var(--ok); }
  .dot { color: var(--accent); }
  .link {
    color: #0a84ff; cursor: pointer; text-decoration: none;
  }
  .link:hover { text-decoration: underline; }

  .mini-warn {
    width: 100%;
    font-size: 11px;
    color: #ffd60a;
    background: rgba(255, 214, 10, 0.1);
    border: 1px solid rgba(255, 214, 10, 0.3);
    border-radius: 8px;
    padding: 7px 10px;
  }

  .error-panel {
    width: 100%;
    box-sizing: border-box;
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--accent);
    background: rgba(255, 69, 58, 0.12);
  }
  /* `display: flex` above is an author rule and outranks the UA
     stylesheet's `[hidden] { display: none }` regardless of selector
     specificity — without this override, panels marked `hidden` would
     still render. Same reasoning applies to .log-panel below. */
  .error-panel[hidden], .log-panel[hidden] { display: none; }
  .error-panel.warning {
    border-color: #ffd60a;
    background: rgba(255, 214, 10, 0.12);
  }
  .error-panel .ep-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .error-panel .ep-title {
    font-size: 13px; font-weight: 600; color: var(--accent);
  }
  .error-panel.warning .ep-title { color: #ffd60a; }
  .error-panel .ep-close {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 2px; flex-shrink: 0;
  }
  .error-panel .ep-close:hover { color: var(--text); }
  .error-panel .ep-message {
    font-family: ui-monospace, monospace;
    font-size: 12px;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
    -webkit-user-select: text;
    user-select: text;
    max-height: 160px;
    overflow-y: auto;
  }
  .error-panel .ep-path {
    font-size: 11px; color: var(--muted);
    font-family: ui-monospace, monospace;
    word-break: break-all;
    -webkit-user-select: text;
    user-select: text;
  }
  .error-panel .ep-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .error-panel .ep-btn {
    padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text);
    font-size: 11px; cursor: pointer;
  }
  .error-panel .ep-btn:hover { border-color: var(--muted); }

  .logs-link {
    color: var(--muted); font-size: 12px; cursor: pointer; text-decoration: none;
    align-self: center; margin-right: auto;
  }
  .logs-link:hover { color: var(--text); text-decoration: underline; }

  .log-panel {
    width: 100%;
    box-sizing: border-box;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .log-panel .lp-head {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .log-panel .lp-title {
    font-size: 11px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .3px; margin-right: auto;
  }
  .log-panel select.level-select {
    width: auto; font-size: 11px; padding: 5px 8px;
  }
  .log-box {
    width: 100%;
    box-sizing: border-box;
    max-height: 40vh;
    overflow-y: auto;
    background: #101012;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-family: ui-monospace, monospace;
    font-size: 10.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    color: #d0d0d5;
    -webkit-user-select: text;
    user-select: text;
  }
  .mic-row { width: 100%; display: flex; flex-direction: column; gap: 6px; }
  .mic-row .cap {
    font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .warn { color: #ffd60a; text-align: right; }
  select {
    width: 100%;
    background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px;
    -webkit-appearance: none; cursor: pointer;
  }
  select:disabled { opacity: .5; cursor: default; }

  .topbar {
    width: calc(100% - 40px); display: flex; align-items: center; justify-content: space-between;
    position: absolute; top: 16px; left: 20px; right: 20px;
  }
  .gear-btn {
    background: none; border: none; color: var(--muted);
    font-size: 19px; cursor: pointer; padding: 4px;
    line-height: 1;
  }
  .gear-btn:hover { color: var(--text); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    display: none; align-items: center; justify-content: center;
    z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 340px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .modal h2 { font-size: 15px; font-weight: 600; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 12px; color: var(--muted);
    display: flex; justify-content: space-between;
  }
  .field .saved-tag { color: var(--ok); }
  .field input {
    background: #1c1c1e; color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 10px; font-size: 13px;
    font-family: ui-monospace, monospace;
  }
  .field input:focus { outline: 1px solid #0a84ff; border-color: #0a84ff; }
  .field .hint { font-size: 11px; color: var(--muted); }
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px;
  }
  .btn {
    padding: 8px 16px; border-radius: 8px; border: none;
    font-size: 13px; cursor: pointer;
  }
  .btn.primary { background: #0a84ff; color: #fff; }
  .btn.secondary { background: var(--border); color: var(--text); }
  .modal-status { font-size: 12px; min-height: 16px; color: var(--ok); }
  .modal-status.error { color: var(--accent); }
</style>
</head>
<body>
  <div class="topbar">
    <a class="logs-link" id="logsLink" title="View log file">Logs</a>
    <button class="gear-btn" id="gearBtn" title="Settings">⚙</button>
  </div>

  <h1>Notetaker</h1>

  <div class="error-panel" id="errorPanel" hidden>
    <div class="ep-head">
      <div class="ep-title" id="epTitle">Error</div>
      <button class="ep-close" id="epClose" title="Dismiss">✕</button>
    </div>
    <div class="ep-message" id="epMessage"></div>
    <div class="ep-path" id="epPath" hidden></div>
    <div class="ep-actions">
      <button class="ep-btn" id="epOpenLog">Open log</button>
      <button class="ep-btn" id="epShowLogs">Show logs</button>
      <button class="ep-btn" id="epShowFinder">Show in Finder</button>
      <button class="ep-btn" id="epCopy">Copy details</button>
    </div>
  </div>

  <div class="mini-warn" id="miniWarn" hidden></div>

  <div class="mic-row">
    <div class="cap"><span>Microphone</span><span class="warn" id="micWarn"></span></div>
    <select id="micSelect" disabled></select>
  </div>

  <div class="timer" id="timer">00:00</div>

  <button class="record-btn" id="recBtn" disabled title="Record / Stop">
    <span class="inner"></span>
  </button>

  <div class="stats">
    <div class="row"><span class="label">Microphone</span><span class="val" id="micSize">—</span></div>
    <div class="row"><span class="label">System audio</span><span class="val" id="sysSize">—</span></div>
    <div class="row"><span class="label">State</span><span class="val" id="stateLbl">ready</span></div>
  </div>

  <div class="status" id="status">Click to start recording.</div>

  <div class="log-panel" id="logPanel" hidden>
    <div class="lp-head">
      <span class="lp-title">Log</span>
      <select class="level-select" id="logLevelSelect">
        <option value="INFO">All</option>
        <option value="WARNING">Warnings+Errors</option>
      </select>
      <button class="ep-btn" id="logRefresh">Refresh</button>
      <button class="ep-btn" id="logOpenFile">Open log file</button>
      <button class="ep-btn" id="logClose">Close</button>
    </div>
    <div class="log-box" id="logBox">Loading…</div>
  </div>

  <div class="overlay" id="settingsOverlay">
    <div class="modal">
      <h2>Settings — API keys</h2>

      <div class="field">
        <label>OpenAI API Key <span class="saved-tag" id="openaiSaved"></span></label>
        <input type="password" id="openaiKey" placeholder="sk-...">
        <span class="hint">Used for transcription (Whisper) and generating notes.</span>
      </div>

      <div class="field">
        <label>Notion Integration Token <span class="saved-tag" id="notionSaved"></span></label>
        <input type="password" id="notionToken" placeholder="ntn_... or secret_...">
        <span class="hint">Optional — only needed to save notes to Notion.</span>
      </div>

      <div class="field">
        <label>Notion — parent page ID <span class="saved-tag" id="notionParentSaved"></span></label>
        <input type="text" id="notionParent" placeholder="e.g. 1a2b3c4d5e6f...">
        <span class="hint">The page/database where notes will be created.</span>
      </div>

      <div class="modal-status" id="modalStatus"></div>

      <div class="modal-actions">
        <button class="btn secondary" id="closeSettings">Close</button>
        <button class="btn primary" id="saveSettings">Save</button>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  let recording = false;
  let busy = false;

  function fmtTime(s) {
    s = Math.floor(s || 0);
    const m = String(Math.floor(s / 60)).padStart(2, "0");
    const ss = String(s % 60).padStart(2, "0");
    return `${m}:${ss}`;
  }
  function fmtBytes(b) {
    if (!b) return "—";
    const mb = b / (1024 * 1024);
    if (mb >= 1) return mb.toFixed(1) + " MB";
    return (b / 1024).toFixed(0) + " KB";
  }
  function setStatus(msg, cls = "") {
    const el = $("status");
    el.className = "status " + cls;
    el.innerHTML = msg;
  }

  // --- Error panel ---

  let currentErrorDetails = null; // { title, message, folder, timestamp }

  function showErrorPanel({ title, message, folder, warning = false }) {
    currentErrorDetails = {
      title: title || "",
      message: message || "",
      folder: folder || "",
      timestamp: new Date().toISOString(),
    };
    $("epTitle").textContent = title || (warning ? "Warning" : "Error");
    $("epMessage").textContent = message || "";
    if (folder) {
      $("epPath").textContent = "Folder: " + folder;
      $("epPath").hidden = false;
    } else {
      $("epPath").hidden = true;
    }
    $("epShowFinder").hidden = !folder;
    $("errorPanel").classList.toggle("warning", !!warning);
    $("errorPanel").hidden = false;
  }

  function hideErrorPanel() {
    $("errorPanel").hidden = true;
    currentErrorDetails = null;
  }

  function hideMiniWarn() {
    $("miniWarn").hidden = true;
    $("miniWarn").textContent = "";
  }

  async function copyErrorDetails() {
    if (!currentErrorDetails) return;
    const text = [
      currentErrorDetails.title,
      currentErrorDetails.message,
      currentErrorDetails.folder ? "Folder: " + currentErrorDetails.folder : "",
      "Time: " + currentErrorDetails.timestamp,
    ].filter(Boolean).join("\n");
    try {
      await navigator.clipboard.writeText(text);
      return;
    } catch (e) {
      // Fallback for environments without clipboard permission.
    }
    try {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    } catch (e) {
      // Give up quietly — nothing more we can do without clipboard access.
    }
  }

  // --- Log viewer ---

  function toggleLogPanel(open) {
    const panel = $("logPanel");
    const shouldOpen = open != null ? open : panel.hidden;
    panel.hidden = !shouldOpen;
    if (shouldOpen) refreshLog();
  }

  async function refreshLog() {
    $("logBox").textContent = "Loading…";
    const minLevel = $("logLevelSelect").value;
    let res;
    try {
      res = await window.pywebview.api.get_log_tail(200, minLevel);
    } catch (e) {
      $("logBox").textContent = "Failed to load log.";
      return;
    }
    if (!res || !res.ok) {
      $("logBox").textContent = "Failed to load log: " + ((res && res.error) || "unknown error");
      return;
    }
    if (!res.exists) {
      $("logBox").textContent = "No log file yet at " + res.path;
      return;
    }
    $("logBox").textContent = res.lines && res.lines.length ? res.lines.join("\n") : "(no matching log lines)";
    $("logBox").scrollTop = $("logBox").scrollHeight;
  }

  const STATE_LABELS = {
    idle: "ready", recording: "● recording", mixing: "mixing…",
    mixed: "mixed", transcribing: "transcribing…",
    summarizing: "notes…", syncing_notion: "sending to Notion…",
    done: "saved", error: "error",
  };

  // Called from Python (evaluate_js) with the current session state.
  window.onStatus = function (data) {
    $("stateLbl").textContent = STATE_LABELS[data.state] || data.state;
    if (data.elapsed != null) $("timer").textContent = fmtTime(data.elapsed);
    if (data.mic_bytes != null) $("micSize").textContent = fmtBytes(data.mic_bytes);
    if (data.system_bytes != null) $("sysSize").textContent = fmtBytes(data.system_bytes);

    // Once synced to Notion, the local session folder is deleted — only
    // offer "show in Finder" while it still exists on disk.
    const folderLink = data.folder && !data.notion_url
      ? ` — <a class="link" onclick="window.pywebview.api.open_folder()">show in Finder</a>`
      : "";

    if (data.state === "mixing") {
      setStatus("Mixing tracks and encoding MP3…");
    } else if (data.state === "mixed") {
      setStatus("Recording saved. Sending for transcription…");
    } else if (data.state === "transcribing") {
      const chunk = data.total > 1 ? ` (chunk ${data.index}/${data.total})` : "";
      setStatus(`Transcribing with OpenAI Whisper…${chunk}`);
    } else if (data.state === "summarizing") {
      setStatus("Generating notes (GPT)…");
      if (data.warnings && data.warnings.length) {
        $("miniWarn").textContent = "Note: " + data.warnings.join("; ");
        $("miniWarn").hidden = false;
      }
    } else if (data.state === "syncing_notion") {
      setStatus("Sending notes to Notion…");
    } else if (data.state === "done") {
      if (data.no_key) {
        setStatus(`Recording saved (no transcription — missing OpenAI key in ⚙)${folderLink}`, "ok");
      } else {
        const title = data.title ? `"${data.title}" — ` : "";
        const notionLink = data.notion_url
          ? ` — <a class="link" onclick="window.pywebview.api.open_url('${data.notion_url}')">open in Notion</a>`
          : data.notion_error
            ? ` (Notion error: ${data.notion_error})`
            : "";
        setStatus(`${title}Notes ready${folderLink}${notionLink}`, "ok");
      }
      if (data.notion_error) {
        showErrorPanel({
          title: "Notion sync failed — notes saved locally",
          message: "Your notes are safe locally on disk. Notion sync failed: " + data.notion_error,
          folder: data.folder,
          warning: true,
        });
      }
      if (data.cleanup_error) {
        showErrorPanel({
          title: "Cleanup incomplete — notes are in Notion",
          message: data.cleanup_error,
          folder: data.folder,
          warning: true,
        });
      }
    } else if (data.state === "error") {
      setStatus("Error: " + (data.error || "unknown"), "error");
      showErrorPanel({
        title: "Recording failed",
        message: data.error || "Unknown error",
        folder: data.folder,
        warning: false,
      });
    }
  };

  async function loadDevices() {
    let devs = [];
    try { devs = await window.pywebview.api.list_devices(); } catch (e) {}
    const sel = $("micSelect");
    sel.innerHTML = "";
    devs.forEach((d) => {
      const o = document.createElement("option");
      o.value = d.index;
      o.textContent = `${d.name} — ${Math.round(d.samplerate / 1000)} kHz`
        + (d.bt ? "  ⚠︎" : "");
      o.dataset.bt = d.bt ? "1" : "";
      sel.appendChild(o);
    });
    // Honor whatever microphone is actually selected in the system — unless
    // it's Bluetooth (HFP degrades quality), in which case fall back to a
    // real built-in/wired mic rather than an arbitrary one (e.g. skip an
    // iPhone Continuity microphone even if it's earlier in the device list).
    const systemDefault = devs.find((d) => d.default);
    const target =
      (systemDefault && !systemDefault.bt && systemDefault) ||
      devs.find((d) => !d.bt && !d.external) ||
      devs.find((d) => !d.bt) ||
      devs[0];
    if (target) sel.value = String(target.index);
    sel.disabled = false;
    updateMicWarn();
  }
  function updateMicWarn() {
    const opt = $("micSelect").selectedOptions[0];
    const bt = opt && opt.dataset.bt === "1";
    $("micWarn").textContent = bt
      ? "Bluetooth — lower quality, pick a built-in microphone"
      : "";
  }

  async function startRec() {
    // A new recording supersedes whatever error/warning was showing before.
    hideErrorPanel();
    hideMiniWarn();
    busy = true; $("recBtn").disabled = true; $("micSelect").disabled = true;
    setStatus("Starting recording…");
    const raw = $("micSelect").value;
    const dev = raw === "" ? null : parseInt(raw, 10);
    const res = await window.pywebview.api.start(Number.isNaN(dev) ? null : dev);
    busy = false; $("recBtn").disabled = false;
    if (!res.ok) {
      $("micSelect").disabled = false;
      setStatus("Failed to start: " + (res.error || "unknown error"), "error");
      showErrorPanel({
        title: "Failed to start recording",
        message: res.error || "Unknown error",
        folder: null,
        warning: false,
      });
      return;
    }
    recording = true;
    document.body.classList.add("recording");
    setStatus('<span class="dot">●</span> Recording…');
  }

  async function stopRec() {
    busy = true; $("recBtn").disabled = true;
    recording = false;
    document.body.classList.remove("recording");
    setStatus("Stopping…");
    const res = await window.pywebview.api.stop();
    busy = false; $("recBtn").disabled = false; $("micSelect").disabled = false;
    if (!res.ok) {
      setStatus("Error while saving: " + (res.error || ""), "error");
    }
  }

  $("recBtn").addEventListener("click", () => {
    if (busy) return;
    recording ? stopRec() : startRec();
  });
  $("micSelect").addEventListener("change", updateMicWarn);

  // --- Error panel wiring ---
  $("epClose").addEventListener("click", hideErrorPanel);
  $("epOpenLog").addEventListener("click", () => window.pywebview.api.open_log());
  $("epShowLogs").addEventListener("click", () => toggleLogPanel(true));
  $("epShowFinder").addEventListener("click", () => window.pywebview.api.open_folder());
  $("epCopy").addEventListener("click", copyErrorDetails);

  // --- Log viewer wiring ---
  $("logsLink").addEventListener("click", () => toggleLogPanel());
  $("logRefresh").addEventListener("click", refreshLog);
  $("logOpenFile").addEventListener("click", () => window.pywebview.api.open_log());
  $("logLevelSelect").addEventListener("change", refreshLog);
  $("logClose").addEventListener("click", () => toggleLogPanel(false));

  // --- Settings (API keys) ---

  function setModalStatus(msg, isError = false) {
    const el = $("modalStatus");
    el.textContent = msg;
    el.className = "modal-status" + (isError ? " error" : "");
  }

  async function refreshKeyStatus() {
    let st = {};
    try { st = await window.pywebview.api.get_key_status(); } catch (e) {}
    $("openaiSaved").textContent = st.openai_set ? "✓ saved" : "";
    $("notionSaved").textContent = st.notion_set ? "✓ saved" : "";
    $("notionParentSaved").textContent = st.notion_parent_set ? "✓ saved" : "";
  }

  async function openSettings() {
    $("openaiKey").value = "";
    $("notionToken").value = "";
    $("notionParent").value = "";
    setModalStatus("");
    await refreshKeyStatus();
    $("settingsOverlay").classList.add("open");
  }
  function closeSettingsModal() {
    $("settingsOverlay").classList.remove("open");
  }

  $("gearBtn").addEventListener("click", openSettings);
  $("closeSettings").addEventListener("click", closeSettingsModal);
  $("settingsOverlay").addEventListener("click", (e) => {
    if (e.target.id === "settingsOverlay") closeSettingsModal();
  });

  $("saveSettings").addEventListener("click", async () => {
    const openai = $("openaiKey").value.trim();
    const notion = $("notionToken").value.trim();
    const parent = $("notionParent").value.trim();
    if (!openai && !notion && !parent) {
      setModalStatus("Enter at least one value.", true);
      return;
    }
    setModalStatus("Saving…");
    const res = await window.pywebview.api.save_keys(openai, notion, parent);
    if (res.ok) {
      setModalStatus("Saved.");
      $("openaiKey").value = "";
      $("notionToken").value = "";
      $("notionParent").value = "";
      await refreshKeyStatus();
    } else {
      setModalStatus("Save failed: " + (res.error || ""), true);
    }
  });

  // Enable the button and load microphones once the pywebview bridge is ready.
  window.addEventListener("pywebviewready", async () => {
    $("recBtn").disabled = false;
    await loadDevices();
    setStatus("Click to start recording.");
  });
</script>
</body>
</html>
